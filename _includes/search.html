<dialog class="search" id="search" aria-label="{{ ui.search_dialog }}" data-index="{{ '/search.json' | relative_url }}">
  <div class="search-panel">
    <div class="search-field">
      <svg class="icon"><use href="#i-search"/></svg>
      <input type="search" id="search-input" placeholder="{{ ui.search_placeholder }}" autocomplete="off" spellcheck="false" aria-label="{{ ui.search_input }}" aria-controls="search-results" aria-autocomplete="list">
      <button class="search-close" type="button" data-close-search aria-label="{{ ui.search_close }}"><kbd>Esc</kbd></button>
    </div>
    <ul class="search-results" id="search-results" role="listbox" aria-label="{{ ui.search_results }}"></ul>
    <div class="search-foot" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> {{ ui.search_select }}</span>
      <span><kbd>↵</kbd> {{ ui.search_open }}</span>
      <span class="search-count" id="search-count"></span>
    </div>
  </div>
</dialog>
