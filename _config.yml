title: Tietorakenteet ja algoritmit
subtitle: kevät 2026
description: Helsingin yliopiston kurssin Tietorakenteet ja algoritmit verkkomateriaali (kevät 2026).
lang: fi
baseurl: "/tira-2026"
url: "https://tira.mooc.fi"
theme-color: '#e76c97'

# The theme lives in this repository (_layouts, _includes, assets). Setting
# theme to null stops GitHub Pages from adding its default Primer theme.
theme: null

# Source repository, used for "Muokkaa GitHubissa" links.
repository: hy-tira/kevat-2026
repository_branch: main

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  # Uncomment for Finnish quotes:
  smart_quotes: rsquo,rsquo,rdquo,rdquo

permalink: /:title/

# Course material. nav_title/nav_subtitle are shown in the navigation.
collections:
  material_1:
    output: true
    permalink: /:title/
    nav_title: Osa I
    nav_subtitle: Viikot 1–8
  material_2:
    output: true
    permalink: /:title/
    nav_title: Osa II
    nav_subtitle: Viikot 9–16

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

# Files that are part of the repository but not of the website. In Jekyll 3
# this list replaces the default one, so the defaults are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - Dockerfile
  - docker-compose.yml
  - README.md
  - CORRECTIONS.md
