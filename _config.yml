title: Tietorakenteet ja algoritmit
subtitle: kevät 2026
lang: fi
baseurl: "/kevat-2026"
url: "https://tira.mooc.fi"
theme-color: '#e76c97'

plugins:
  - jekyll-remote-theme

remote_theme: ollpu/jekyll-course-theme@v2

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  # Uncomment for Finnish quotes:
  smart_quotes: rsquo,rsquo,rdquo,rdquo

permalink: /:title/

hide_other_section_menus: true

small_code_font: true

# If you want a collection of pages for course material:
collections:
  # In Finnish you might want to write e.g. "materiaali:" instead.
  material_1:
    output: true
    permalink: /:title/
  material_2:
    output: true
    permalink: /:title/

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

# Files that are part of the repository but not of the website. In Jekyll 3
# this list replaces the default one, so the defaults are repeated here.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - CORRECTIONS.md
